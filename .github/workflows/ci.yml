name: ML Model CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Train model
      run: |
        python train_model.py
        
    - name: Test model
      run: |
        python test_model.py
        
    - name: Check if FastAPI app starts
      run: |
        timeout 5 python -c "import uvicorn; import importlib.util; spec = importlib.util.spec_from_file_location('app', 'app.py'); app = importlib.util.module_from_spec(spec); spec.loader.exec_module(app)" || code=$?; if [[ $code -ne 124 && $code -ne 0 ]]; then exit $code; fi 